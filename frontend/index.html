<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image → Motion Studio</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><b>IMAGE → MOTION</b><span id="hs" class="pill">…</span></header>
<main>
<section id="dashboard" class="page"><h2>Dashboard</h2><div id="plist" class="grid"></div></section>
<section id="create" class="page"><h2>Create</h2>
 <label class="drop" id="drop"><input type="file" id="file" accept="image/*" hidden><div id="dt">＋ UPLOAD IMAGE<small>atau drop di sini</small></div><img id="prev" hidden></label>
 <div class="glass row"><label>Rasio <select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></label>
 <label>Durasi <select id="dur"><option>5</option><option selected>8</option><option>10</option></select></label>
 <label>FPS <select id="fps"><option>24</option><option>30</option></select></label>
 <label><input type="checkbox" id="safe" checked> STOCK SAFE</label></div>
 <button class="big" id="go">⚡ ANALISIS + GENERATE DEWA</button>
 <div id="checks" class="glass" hidden></div>
 <div id="meta" class="glass" hidden></div></section>
<section id="projects" class="page"><h2>Projects</h2><div id="pr" class="grid"></div></section>
<section id="lab" class="page"><h2>Prompt Lab</h2><div id="labinfo" class="muted">Buka project atau jalankan Create dulu.</div>
 <button class="big" id="regen">🔄 REGENERATE</button><div id="vars"></div></section>
<section id="settings" class="page"><h2>Settings</h2><pre id="sinfo" class="glass"></pre>
 <p class="muted">Atur provider/API key lewat file .env lalu restart server.</p></section>
</main>
<nav id="nav"><a data-p="dashboard">Home</a><a data-p="create">Create</a><a data-p="projects">Projects</a><a data-p="lab">Lab</a><a data-p="settings">Settings</a></nav>
<div id="toast"></div><script src="js/app.js"></script></body></html>
